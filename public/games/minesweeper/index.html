<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper Pro - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { background: #060913; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 10px; }
    .back-btn { background: #1e293b; color: #38bdf8; text-decoration: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; }
    .status { background: #0f172a; border: 1px solid #1e293b; padding: 5px 14px; border-radius: 8px; font-weight: 900; color: #facc15; }
    .grid { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 3px; background: #0f172a; padding: 8px; border-radius: 12px; border: 2px solid #334155; touch-action: manipulation; }
    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(9, 34px); grid-template-rows: repeat(9, 34px); gap: 2px; }
    }
    .cell {
      background: #1e293b; border-radius: 4px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
    }
    .cell.revealed { background: #090e17; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); cursor: default; }
    .cell.mine { background: #e11d48 !important; }
    .c-1 { color: #38bdf8; } .c-2 { color: #4ade80; } .c-3 { color: #f43f5e; } .c-4 { color: #a855f7; }
    .btn { margin-top: 14px; background: #0284c7; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="status">💣 Mines: <span id="mineCount">10</span></div>
  </header>

  <div class="grid" id="grid"></div>
  <button class="btn" onclick="initBoard()">Restart Board</button>

  <script>
    const ROWS = 9, COLS = 9, MINES = 10;
    let board = [], revealedCount = 0, gameOver = false;

    function initBoard() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null).map(() => ({
        mine: false, revealed: false, flagged: false, count: 0
      })));
      revealedCount = 0; gameOver = false;
      document.getElementById('mineCount').textContent = MINES;

      // Place mines
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine) {
          board[r][c].mine = true;
          placed++;
        }
      }

      // Calculate neighbor counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) cnt++;
              }
            }
            board[r][c].count = cnt;
          }
        }
      }

      render();
    }

    const gridEl = document.getElementById('grid');

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell' + (cell.revealed ? ' revealed' : '') + (cell.revealed && cell.mine ? ' mine' : '');
          if (cell.revealed) {
            if (cell.mine) div.textContent = '💣';
            else if (cell.count > 0) {
              div.textContent = cell.count;
              div.classList.add(`c-${cell.count}`);
            }
          } else if (cell.flagged) {
            div.textContent = '🚩';
          }
          div.onclick = () => revealCell(r, c);
          div.oncontextmenu = (e) => { e.preventDefault(); flagCell(r, c); };
          gridEl.appendChild(div);
        }
      }
    }

    function revealCell(r, c) {
      if (gameOver || board[r][c].revealed || board[r][c].flagged) return;

      const cell = board[r][c];
      cell.revealed = true;
      revealedCount++;

      if (cell.mine) {
        gameOver = true;
        // Reveal all mines
        board.forEach(row => row.forEach(cl => { if (cl.mine) cl.revealed = true; }));
        render();
        alert('BOOM! 💥 Hit a mine!');
        return;
      }

      if (cell.count === 0) {
        // Flood reveal
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) revealCell(nr, nc);
          }
        }
      }

      render();

      if (revealedCount === ROWS * COLS - MINES) {
        gameOver = true;
        alert('🎉 CONGRATULATIONS! You cleared all mines!');
      }
    }

    function flagCell(r, c) {
      if (gameOver || board[r][c].revealed) return;
      board[r][c].flagged = !board[r][c].flagged;
      render();
    }

    initBoard();
  </script>
</body>
</html>
