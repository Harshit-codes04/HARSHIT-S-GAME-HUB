<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Penalty Shootout 2026 - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { background: #060913; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 460px; margin-bottom: 8px; }
    .back-btn { background: #1e293b; color: #38bdf8; text-decoration: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; }
    .score-box { background: #0f172a; border: 1px solid #1e293b; padding: 5px 14px; border-radius: 8px; font-weight: 900; color: #4ade80; }
    canvas { background: #064e3b; border: 4px solid #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); touch-action: none; max-width: 100%; height: auto; }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="score-box">⚽ Goals: <b id="score">0</b></div>
  </header>

  <canvas id="c" width="440" height="540"></canvas>
  <div class="hint">Swipe / Flick the soccer ball towards the net to beat the goalkeeper!</div>

  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let score = 0, statusText = 'SWIPE BALL TO SHOOT!';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, dur=0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const goal = { x: 50, y: 50, w: 340, h: 140 };
    const goalie = { x: 220, y: 150, w: 50, h: 40, vx: 3.5, color: '#f43f5e' };
    const ball = { x: 220, y: 460, r: 18, vx: 0, vy: 0, inAir: false };

    let startX = 0, startY = 0;
    c.addEventListener('pointerdown', e => {
      const rect = c.getBoundingClientRect();
      startX = (e.clientX - rect.left) * (c.width / rect.width);
      startY = (e.clientY - rect.top) * (c.height / rect.height);
    });

    c.addEventListener('pointerup', e => {
      if (ball.inAir) return;
      const rect = c.getBoundingClientRect();
      const endX = (e.clientX - rect.left) * (c.width / rect.width);
      const endY = (e.clientY - rect.top) * (c.height / rect.height);

      const dx = endX - startX;
      const dy = endY - startY;
      if (dy < -20) {
        ball.vx = dx * 0.12;
        ball.vy = dy * 0.18;
        ball.inAir = true;
        sfx(280);
      }
    });

    function resetBall() {
      ball.x = 220; ball.y = 460;
      ball.vx = 0; ball.vy = 0;
      ball.inAir = false;
    }

    function loop() {
      ctx.clearRect(0, 0, c.width, c.height);

      // Grass Pitch lines
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 3;
      ctx.strokeRect(20, 20, c.width - 40, c.height - 40);
      ctx.beginPath(); ctx.arc(220, 460, 60, 0, Math.PI * 2); ctx.stroke();

      // Goal Post
      ctx.fillStyle = '#065f46';
      ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
      ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

      // Move Goalie
      goalie.x += goalie.vx;
      if (goalie.x <= goal.x + 30 || goalie.x + goalie.w >= goal.x + goal.w - 30) goalie.vx *= -1;

      // Draw Goalie
      ctx.fillStyle = goalie.color;
      ctx.fillRect(goalie.x, goalie.y, goalie.w, goalie.h);
      ctx.fillStyle = '#fff'; ctx.fillRect(goalie.x + 8, goalie.y + 8, 10, 10); ctx.fillRect(goalie.x + goalie.w - 18, goalie.y + 8, 10, 10);

      // Move Ball
      if (ball.inAir) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Check goalie save
        if (ball.x >= goalie.x && ball.x <= goalie.x + goalie.w &&
            ball.y >= goalie.y && ball.y <= goalie.y + goalie.h) {
          statusText = 'SAVED BY GOALIE! 🧤';
          sfx(180, 0.2);
          setTimeout(resetBall, 1000);
          ball.inAir = false;
        } else if (ball.y <= goal.y + goal.h) {
          if (ball.x >= goal.x && ball.x <= goal.x + goal.w && ball.y >= goal.y) {
            score++;
            document.getElementById('score').textContent = score;
            statusText = 'GOAL! ⚽💥';
            sfx(650, 0.3);
          } else {
            statusText = 'MISSED WIDE! ❌';
            sfx(150, 0.15);
          }
          setTimeout(resetBall, 1000);
          ball.inAir = false;
        }
      }

      // Draw Ball
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2); ctx.fill();

      // Status
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 20px system-ui';
      ctx.fillText(statusText, c.width / 2 - 110, 260);

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
