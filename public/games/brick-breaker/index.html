<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brick Breaker Pro - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #060913;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-bottom: 8px;
    }
    .back-btn {
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .stats {
      display: flex;
      gap: 14px;
      font-weight: 900;
      font-size: 1rem;
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    canvas {
      background: #090e17;
      border: 4px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56, 189, 248, 0.2);
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
    .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="stats">
      <span style="color:#fbbf24">Score: <b id="score">0</b></span>
      <span style="color:#f43f5e">Lives: <b id="lives">❤️❤️❤️</b></span>
    </div>
  </header>

  <canvas id="c" width="460" height="580"></canvas>
  <div class="hint">Move mouse or drag paddle to bounce silver ball & smash neon bricks!</div>

  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let score = 0, lives = 3, gameOver = false;

    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, type='sine', dur=0.06, vol=0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const paddle = { x: 190, y: 540, w: 90, h: 14, color: '#38bdf8' };
    const ball = { x: 230, y: 510, r: 8, vx: 4, vy: -4.5, inPlay: true };

    const rows = 5, cols = 8;
    const brickW = 48, brickH = 18, brickPad = 6, brickOffsetTop = 50, brickOffsetLeft = 18;
    const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];

    let bricks = [];
    function initBricks() {
      bricks = [];
      for (let r = 0; r < rows; r++) {
        for (let cl = 0; cl < cols; cl++) {
          bricks.push({
            x: brickOffsetLeft + cl * (brickW + brickPad),
            y: brickOffsetTop + r * (brickH + brickPad),
            w: brickW, h: brickH,
            color: colors[r],
            alive: true
          });
        }
      }
    }

    const particles = [];
    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 4;
        particles.push({
          x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          color, life: 1, decay: 0.04
        });
      }
    }

    function setPaddleX(clientX) {
      const rect = c.getBoundingClientRect();
      const scaleX = c.width / rect.width;
      const x = (clientX - rect.left) * scaleX;
      paddle.x = Math.max(10, Math.min(c.width - paddle.w - 10, x - paddle.w / 2));
    }

    c.addEventListener('mousemove', e => setPaddleX(e.clientX));
    c.addEventListener('touchmove', e => {
      e.preventDefault();
      setPaddleX(e.touches[0].clientX);
    }, { passive: false });

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 20;
      ball.vx = (Math.random() > 0.5 ? 4 : -4);
      ball.vy = -4.5;
    }

    function loop() {
      if (!gameOver) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; sfx(240); }
        if (ball.x + ball.r > c.width) { ball.x = c.width - ball.r; ball.vx *= -1; sfx(240); }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; sfx(240); }

        // Paddle collision with angle deflection
        if (ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h) {
          if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
            const hitPoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
            ball.vx = hitPoint * 6;
            ball.vy = -Math.abs(ball.vy);
            sfx(440, 'triangle', 0.08, 0.25);
            spawnParticles(ball.x, ball.y, '#38bdf8');
          }
        }

        // Brick collision
        for (let b of bricks) {
          if (b.alive) {
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
                ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
              b.alive = false;
              ball.vy *= -1;
              score += 20;
              document.getElementById('score').textContent = score;
              sfx(600 + Math.random() * 200, 'square', 0.06, 0.2);
              spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);

              // Check round win
              if (bricks.every(k => !k.alive)) {
                initBricks();
                resetBall();
              }
              break;
            }
          }
        }

        // Bottom death
        if (ball.y - ball.r > c.height) {
          lives--;
          sfx(160, 'sawtooth', 0.3, 0.3);
          if (lives <= 0) {
            gameOver = true;
            document.getElementById('lives').textContent = 'GAME OVER';
          } else {
            document.getElementById('lives').textContent = '❤️'.repeat(lives);
            resetBall();
          }
        }
      }

      // Drawing
      ctx.clearRect(0, 0, c.width, c.height);

      // Bricks
      for (let b of bricks) {
        if (b.alive) {
          ctx.fillStyle = b.color;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 8;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = '#ffffff44';
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      }
      ctx.shadowBlur = 0;

      // Paddle
      ctx.fillStyle = paddle.color;
      ctx.shadowColor = paddle.color;
      ctx.shadowBlur = 12;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.shadowBlur = 0;

      // Ball
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 30px system-ui';
        ctx.fillText('GAME OVER', c.width / 2 - 90, c.height / 2);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px system-ui';
        ctx.fillText('Tap anywhere to play again', c.width / 2 - 95, c.height / 2 + 35);
      }

      requestAnimationFrame(loop);
    }

    c.addEventListener('click', () => {
      if (gameOver) {
        score = 0; lives = 3; gameOver = false;
        document.getElementById('score').textContent = 0;
        document.getElementById('lives').textContent = '❤️❤️❤️';
        initBricks();
        resetBall();
      }
    });

    initBricks();
    loop();
  </script>
</body>
</html>
