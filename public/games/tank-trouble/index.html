<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tank Trouble 1990 - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      background: #060913;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
      gap: 8px;
    }
    .back-btn {
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .modes-group {
      display: flex;
      gap: 4px;
      background: #111827;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid #1f2937;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .mode-btn.active {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
    }
    .score-board {
      display: flex;
      gap: 12px;
      background: #0f172a;
      padding: 5px 14px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      font-weight: 900;
      font-size: 1.1rem;
    }
    canvas {
      background: #0b0f19;
      border: 4px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56, 189, 248, 0.15);
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
    .touch-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin-top: 8px;
      gap: 10px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 4px;
    }
    .ctrl-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .fire-btn {
      width: 90px;
      height: 90px;
      background: #e11d48;
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
      cursor: pointer;
    }
    .fire-btn:active { transform: scale(0.92); }
    .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="modes-group">
      <button class="mode-btn active" id="botBtn" onclick="setMode('bot')">🤖 vs AI Tank</button>
      <button class="mode-btn" id="pvpBtn" onclick="setMode('pvp')">⚔️ 1v1 Battle</button>
    </div>
    <div class="score-board">
      <span style="color:#38bdf8" id="p1Score">Blue: 0</span>
      <span style="color:#64748b">:</span>
      <span style="color:#f43f5e" id="p2Score">Red: 0</span>
    </div>
  </header>

  <canvas id="c" width="480" height="480"></canvas>

  <div class="touch-controls">
    <div class="dpad">
      <div></div>
      <button class="ctrl-btn" onpointerdown="keys['ArrowUp']=true" onpointerup="keys['ArrowUp']=false">⬆️</button>
      <div></div>
      <button class="ctrl-btn" onpointerdown="keys['ArrowLeft']=true" onpointerup="keys['ArrowLeft']=false">⬅️</button>
      <button class="ctrl-btn" onpointerdown="keys['ArrowDown']=true" onpointerup="keys['ArrowDown']=false">⬇️</button>
      <button class="ctrl-btn" onpointerdown="keys['ArrowRight']=true" onpointerup="keys['ArrowRight']=false">➡️</button>
    </div>
    <button class="fire-btn" onclick="fireBullet(p1)">FIRE 💥</button>
  </div>
  <div class="hint">PC: WASD / Arrow Keys to Drive & Aim • Spacebar to Fire • Bullets Ricochet 5 times!</div>

  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let mode = 'bot';
    let p1Wins = 0, p2Wins = 0;
    const keys = {};

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space') fireBullet(p1);
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // Audio FX Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, type='square', dur=0.08, vol=0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    // Maze Walls
    const walls = [
      { x: 40, y: 40, w: 400, h: 10 },
      { x: 40, y: 430, w: 400, h: 10 },
      { x: 40, y: 40, w: 10, h: 400 },
      { x: 430, y: 40, w: 10, h: 400 },
      // Inner maze partitions
      { x: 120, y: 120, w: 100, h: 10 },
      { x: 260, y: 120, w: 100, h: 10 },
      { x: 235, y: 180, w: 10, h: 120 },
      { x: 120, y: 350, w: 100, h: 10 },
      { x: 260, y: 350, w: 100, h: 10 },
      { x: 120, y: 200, w: 10, h: 90 },
      { x: 350, y: 200, w: 10, h: 90 },
    ];

    const p1 = { x: 90, y: 90, angle: 0, color: '#38bdf8', r: 16, alive: true };
    const p2 = { x: 390, y: 390, angle: Math.PI, color: '#f43f5e', r: 16, alive: true };
    let bullets = [];
    let particles = [];

    function setMode(m) {
      mode = m;
      document.getElementById('botBtn').className = m === 'bot' ? 'mode-btn active' : 'mode-btn';
      document.getElementById('pvpBtn').className = m === 'pvp' ? 'mode-btn active' : 'mode-btn';
      p1Wins = 0; p2Wins = 0;
      updateScore();
      respawn();
    }

    function updateScore() {
      document.getElementById('p1Score').textContent = `Blue: ${p1Wins}`;
      document.getElementById('p2Score').textContent = `Red: ${p2Wins}`;
    }

    function fireBullet(tank) {
      if (!tank.alive) return;
      sfx(520, 'triangle', 0.09, 0.25);
      const bx = tank.x + Math.cos(tank.angle) * 22;
      const by = tank.y + Math.sin(tank.angle) * 22;
      bullets.push({
        x: bx, y: by,
        vx: Math.cos(tank.angle) * 4.8,
        vy: Math.sin(tank.angle) * 4.8,
        bounces: 0,
        owner: tank
      });
    }

    function respawn() {
      p1.x = 90; p1.y = 90; p1.angle = 0; p1.alive = true;
      p2.x = 390; p2.y = 390; p2.angle = Math.PI; p2.alive = true;
      bullets = [];
    }

    function explode(x, y, color) {
      sfx(140, 'sawtooth', 0.35, 0.35);
      for (let i = 0; i < 20; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        particles.push({
          x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          color, life: 1, decay: 0.03
        });
      }
    }

    function checkWallCollision(x, y, r) {
      for (let w of walls) {
        if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) {
          return true;
        }
      }
      return false;
    }

    let botTimer = 0;
    function updateBot() {
      if (mode !== 'bot' || !p2.alive) return;
      botTimer++;

      // Face player 1
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const targetAngle = Math.atan2(dy, dx);

      p2.angle += (targetAngle - p2.angle) * 0.08;

      // Move forward towards player if not in wall
      const nx = p2.x + Math.cos(p2.angle) * 1.5;
      const ny = p2.y + Math.sin(p2.angle) * 1.5;
      if (!checkWallCollision(nx, ny, p2.r)) {
        p2.x = nx; p2.y = ny;
      }

      // Fire periodically
      if (botTimer % 90 === 0 && Math.hypot(dx, dy) < 300) {
        fireBullet(p2);
      }
    }

    function loop() {
      // Player 1 controls
      if (p1.alive) {
        if (keys['ArrowLeft'] || keys['a']) p1.angle -= 0.06;
        if (keys['ArrowRight'] || keys['d']) p1.angle += 0.06;
        let speed = 0;
        if (keys['ArrowUp'] || keys['w']) speed = 2.2;
        if (keys['ArrowDown'] || keys['s']) speed = -1.6;

        if (speed !== 0) {
          const nx = p1.x + Math.cos(p1.angle) * speed;
          const ny = p1.y + Math.sin(p1.angle) * speed;
          if (!checkWallCollision(nx, ny, p1.r)) {
            p1.x = nx; p1.y = ny;
          }
        }
      }

      // Player 2 / Bot controls
      if (mode === 'bot') {
        updateBot();
      } else if (p2.alive) {
        if (keys['j']) p2.angle -= 0.06;
        if (keys['l']) p2.angle += 0.06;
        let s2 = 0;
        if (keys['i']) s2 = 2.2;
        if (keys['k']) s2 = -1.6;
        if (s2 !== 0) {
          const nx = p2.x + Math.cos(p2.angle) * s2;
          const ny = p2.y + Math.sin(p2.angle) * s2;
          if (!checkWallCollision(nx, ny, p2.r)) {
            p2.x = nx; p2.y = ny;
          }
        }
        if (keys['Enter']) fireBullet(p2);
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Bounce on walls
        for (let w of walls) {
          if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
            // Rebound
            if (b.x - b.vx <= w.x || b.x - b.vx >= w.x + w.w) b.vx *= -1;
            else b.vy *= -1;
            b.bounces++;
            sfx(300, 'sine', 0.04, 0.1);
            break;
          }
        }

        // Tank hit checks
        if (p1.alive && Math.hypot(b.x - p1.x, b.y - p1.y) < p1.r) {
          p1.alive = false;
          explode(p1.x, p1.y, p1.color);
          bullets.splice(i, 1);
          p2Wins++;
          updateScore();
          setTimeout(respawn, 1500);
          continue;
        }
        if (p2.alive && Math.hypot(b.x - p2.x, b.y - p2.y) < p2.r) {
          p2.alive = false;
          explode(p2.x, p2.y, p2.color);
          bullets.splice(i, 1);
          p1Wins++;
          updateScore();
          setTimeout(respawn, 1500);
          continue;
        }

        // Expire after 5 bounces
        if (b.bounces > 5) {
          bullets.splice(i, 1);
        }
      }

      // Render
      ctx.clearRect(0, 0, c.width, c.height);

      // Draw Walls
      ctx.fillStyle = '#334155';
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 8;
      for (let w of walls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
      }
      ctx.shadowBlur = 0;

      // Draw Tanks
      function drawTank(t) {
        if (!t.alive) return;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.angle);

        // Body
        ctx.fillStyle = t.color;
        ctx.fillRect(-14, -12, 28, 24);
        // Treads
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-15, -14, 30, 4);
        ctx.fillRect(-15, 10, 30, 4);
        // Turret
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
        // Barrel
        ctx.fillStyle = t.color;
        ctx.fillRect(0, -3, 20, 6);
        ctx.restore();
      }

      drawTank(p1);
      drawTank(p2);

      // Draw Bullets
      ctx.fillStyle = '#fde047';
      ctx.shadowColor = '#fde047';
      ctx.shadowBlur = 10;
      for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
