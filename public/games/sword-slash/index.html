<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blade Slash Duel - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #060913;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-bottom: 8px;
    }
    .back-btn {
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .score-badge {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 5px 14px;
      border-radius: 8px;
      font-weight: 900;
      color: #f43f5e;
    }
    canvas {
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
      border: 4px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(56, 189, 248, 0.15);
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 460px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      border: none;
    }
    .btn.strike { background: #e11d48; color: #fff; box-shadow: 0 0 15px rgba(225, 29, 72, 0.4); }
    .btn.parry { background: #0284c7; color: #fff; box-shadow: 0 0 15px rgba(2, 132, 199, 0.4); }
    .btn:active { transform: scale(0.95); }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="score-badge">⚔️ Duels Won: <b id="score">0</b></div>
  </header>

  <canvas id="c" width="460" height="480"></canvas>

  <div class="controls">
    <button class="btn strike" onclick="playerAction('strike')">⚔️ BLADE STRIKE</button>
    <button class="btn parry" onclick="playerAction('parry')">🛡️ SHIELD PARRY</button>
  </div>
  <div class="hint">Parry when opponent raises sword! Strike during recovery opening to defeat samurai!</div>

  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let wins = 0, gameOver = false, banner = 'READY...';

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, type='triangle', dur=0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const p1 = { x: 130, y: 320, state: 'idle', hp: 3 };
    const ai = { x: 330, y: 320, state: 'idle', hp: 3, timer: 0 };
    let sparks = [];

    function playerAction(act) {
      if (gameOver || p1.state !== 'idle') return;
      p1.state = act;

      if (act === 'parry') {
        sfx(540, 'sine', 0.15);
        if (ai.state === 'strike') {
          // Successful parry! Stun AI
          ai.state = 'stun';
          ai.timer = 50;
          banner = 'PARRIED! STRIKE NOW! ⚡';
          sfx(880, 'square', 0.2);
          spawnSparks(230, 280);
        }
      } else if (act === 'strike') {
        sfx(280, 'sawtooth', 0.15);
        if (ai.state === 'parry') {
          // AI blocked
          banner = 'OPPONENT BLOCKED!';
          sfx(180, 'square');
        } else {
          // Hit AI!
          ai.hp--;
          spawnSparks(ai.x, ai.y - 20);
          sfx(440, 'triangle', 0.2);
          if (ai.hp <= 0) {
            wins++;
            document.getElementById('score').textContent = wins;
            banner = 'VICTORY! 🏆';
            gameOver = true;
            sfx(659, 'sine', 0.4);
          }
        }
      }

      setTimeout(() => { if (!gameOver) p1.state = 'idle'; }, 300);
    }

    function spawnSparks(x, y) {
      for (let i = 0; i < 15; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        sparks.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1 });
      }
    }

    function aiThink() {
      if (gameOver) return;
      ai.timer--;

      if (ai.timer <= 0) {
        if (ai.state === 'stun') {
          ai.state = 'idle';
          ai.timer = 40;
        } else {
          const rand = Math.random();
          if (rand < 0.55) {
            // AI Prepares attack
            ai.state = 'windup';
            banner = '⚠️ ENEMY PREPARING STRIKE!';
            ai.timer = 35;
          } else {
            ai.state = 'parry';
            ai.timer = 25;
          }
        }
      } else if (ai.state === 'windup' && ai.timer <= 10) {
        // AI Strikes!
        ai.state = 'strike';
        sfx(250, 'sawtooth');
        if (p1.state !== 'parry') {
          p1.hp--;
          spawnSparks(p1.x, p1.y - 20);
          if (p1.hp <= 0) {
            banner = 'DEFEATED! 💀';
            gameOver = true;
            sfx(140, 'sawtooth', 0.4);
          }
        }
      }
    }

    function loop() {
      aiThink();
      ctx.clearRect(0, 0, c.width, c.height);

      // Dojo Wood Floor
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(20, 360, c.width - 40, 80);
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 4;
      ctx.strokeRect(20, 360, c.width - 40, 80);

      // HP Hearts
      ctx.font = '20px system-ui';
      ctx.fillText(`Player: ${'❤️'.repeat(Math.max(0, p1.hp))}`, 30, 40);
      ctx.fillText(`Samurai: ${'❤️'.repeat(Math.max(0, ai.hp))}`, 270, 40);

      // Banner Text
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(banner, c.width / 2 - 110, 120);

      // Draw P1 (Blue Blade Warrior)
      ctx.save();
      ctx.translate(p1.x, p1.y);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-16, -50, 32, 50); // Body
      ctx.fillStyle = '#fef08a'; // Face
      ctx.beginPath(); ctx.arc(0, -65, 14, 0, Math.PI * 2); ctx.fill();

      // Sword
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.beginPath();
      if (p1.state === 'strike') {
        ctx.moveTo(10, -30); ctx.lineTo(60, -20);
      } else if (p1.state === 'parry') {
        ctx.moveTo(15, -60); ctx.lineTo(15, 0);
      } else {
        ctx.moveTo(10, -30); ctx.lineTo(35, -55);
      }
      ctx.stroke();
      ctx.restore();

      // Draw AI (Red Samurai Warrior)
      ctx.save();
      ctx.translate(ai.x, ai.y);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-16, -50, 32, 50);
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(0, -65, 14, 0, Math.PI * 2); ctx.fill();

      // Sword
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.beginPath();
      if (ai.state === 'strike') {
        ctx.moveTo(-10, -30); ctx.lineTo(-60, -20);
      } else if (ai.state === 'parry') {
        ctx.moveTo(-15, -60); ctx.lineTo(-15, 0);
      } else if (ai.state === 'windup') {
        ctx.moveTo(-10, -30); ctx.lineTo(-30, -75);
      } else {
        ctx.moveTo(-10, -30); ctx.lineTo(-35, -55);
      }
      ctx.stroke();
      ctx.restore();

      // Sparks
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx; sp.y += sp.vy; sp.life -= 0.05;
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(sp.x, sp.y, 3, 0, Math.PI * 2); ctx.fill();
        if (sp.life <= 0) sparks.splice(i, 1);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 30px system-ui';
        ctx.fillText(banner, c.width / 2 - 100, c.height / 2);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px system-ui';
        ctx.fillText('Tap anywhere to Duel Again', c.width / 2 - 95, c.height / 2 + 35);
      }

      requestAnimationFrame(loop);
    }

    c.addEventListener('click', () => {
      if (gameOver) {
        gameOver = false; p1.hp = 3; ai.hp = 3; banner = 'FIGHT!';
        p1.state = 'idle'; ai.state = 'idle'; ai.timer = 30;
      }
    });

    loop();
  </script>
</body>
</html>
