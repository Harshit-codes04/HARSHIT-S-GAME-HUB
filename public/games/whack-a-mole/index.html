<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whack-A-Mole - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #060913;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
    }
    .back-btn {
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .stats {
      display: flex;
      gap: 12px;
      font-weight: 900;
      font-size: 1.1rem;
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 14px;
      margin-top: 10px;
    }
    @media (max-width: 380px) {
      .grid {
        grid-template-columns: repeat(3, 95px);
        grid-template-rows: repeat(3, 95px);
        gap: 10px;
      }
    }
    .hole {
      background: #1e293b;
      border: 4px solid #334155;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 8px 15px rgba(0,0,0,0.8);
      touch-action: manipulation;
    }
    .mole {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .hole.up .mole {
      bottom: 5%;
    }
    .hole.whacked .mole {
      transform: scale(0.85) rotate(-15deg);
      filter: grayscale(1);
    }
    .btn {
      margin-top: 20px;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="stats">
      <span style="color:#fbbf24">Score: <b id="score">0</b></span>
      <span style="color:#f43f5e">Time: <b id="time">30s</b></span>
    </div>
  </header>

  <div class="grid" id="grid">
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
    <div class="hole"><div class="mole">🐹</div></div>
  </div>

  <button class="btn" id="startBtn" onclick="startGame()">Start 30s Game</button>

  <script>
    const holes = document.querySelectorAll('.hole');
    const scoreVal = document.getElementById('score');
    const timeVal = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');

    let score = 0, timeLeft = 30, timer = null, moleTimer = null;
    let lastHole = null;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, type='sine', dur=0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function randomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) return randomHole();
      lastHole = hole;
      return hole;
    }

    function popMole() {
      if (timeLeft <= 0) return;
      const hole = randomHole();
      hole.classList.remove('whacked');
      hole.classList.add('up');

      const popTime = Math.random() * 600 + 450;
      setTimeout(() => {
        hole.classList.remove('up');
        if (timeLeft > 0) popMole();
      }, popTime);
    }

    holes.forEach(h => {
      h.addEventListener('pointerdown', () => {
        if (h.classList.contains('up') && !h.classList.contains('whacked')) {
          score += 10;
          scoreVal.textContent = score;
          h.classList.add('whacked');
          sfx(580, 'triangle', 0.1);
          setTimeout(() => h.classList.remove('up'), 150);
        }
      });
    });

    function startGame() {
      score = 0; timeLeft = 30;
      scoreVal.textContent = score;
      timeVal.textContent = timeLeft + 's';
      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';

      popMole();
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeVal.textContent = timeLeft + 's';
        if (timeLeft <= 0) {
          clearInterval(timer);
          sfx(220, 'sawtooth', 0.4);
          alert(`Time's up! 🎉 Final Score: ${score}`);
          startBtn.disabled = false;
          startBtn.style.opacity = '1';
        }
      }, 1000);
    }
  </script>
</body>
</html>
