<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fruit Ninja Slice - Harshit's Game Hub</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { background: #060913; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 460px; margin-bottom: 8px; }
    .back-btn { background: #1e293b; color: #38bdf8; text-decoration: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; }
    .score-box { background: #0f172a; border: 1px solid #1e293b; padding: 5px 14px; border-radius: 8px; font-weight: 900; color: #f43f5e; }
    canvas { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); border: 4px solid #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); touch-action: none; max-width: 100%; height: auto; }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Hub</a>
    <div class="score-box">🍉 Sliced: <b id="score">0</b></div>
  </header>

  <canvas id="c" width="440" height="560"></canvas>
  <div class="hint">Swipe / Slice flying fruits with your finger! Avoid the black bombs!</div>

  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let score = 0, gameOver = false, frame = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    let fruits = [];
    let trail = [];

    const fruitTypes = [
      { emoji: '🍉', color: '#ef4444' },
      { emoji: '🍊', color: '#f97316' },
      { emoji: '🍍', color: '#facc15' },
      { emoji: '🍎', color: '#dc2626' },
      { emoji: '💣', color: '#000000', isBomb: true }
    ];

    function spawnFruit() {
      const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
      fruits.push({
        x: Math.random() * (c.width - 120) + 60,
        y: c.height + 30,
        vx: (Math.random() - 0.5) * 5,
        vy: -(12 + Math.random() * 4),
        r: 28,
        ...type
      });
    }

    c.addEventListener('pointermove', e => {
      const rect = c.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (c.width / rect.width);
      const y = (e.clientY - rect.top) * (c.height / rect.height);
      trail.push({ x, y, life: 10 });

      // Check fruit slice
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (Math.hypot(x - f.x, y - f.y) < f.r) {
          if (f.isBomb) {
            gameOver = true;
            sfx(120);
          } else {
            score += 10;
            document.getElementById('score').textContent = score;
            sfx(650);
            fruits.splice(i, 1);
          }
          break;
        }
      }
    });

    function loop() {
      frame++;
      ctx.clearRect(0, 0, c.width, c.height);

      if (!gameOver) {
        if (frame % 40 === 0) spawnFruit();

        for (let i = fruits.length - 1; i >= 0; i--) {
          const f = fruits[i];
          f.x += f.vx;
          f.y += f.vy;
          f.vy += 0.35; // Gravity

          ctx.font = '36px system-ui';
          ctx.fillText(f.emoji, f.x - 18, f.y + 12);

          if (f.y > c.height + 50) fruits.splice(i, 1);
        }
      }

      // Blade Trail
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const pt = trail[i];
        pt.life--;
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      trail = trail.filter(p => p.life > 0);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 30px system-ui';
        ctx.fillText('BOMB EXPLODED! 💥', c.width / 2 - 130, c.height / 2);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px system-ui';
        ctx.fillText('Tap to Slice Again', c.width / 2 - 60, c.height / 2 + 35);
      }

      requestAnimationFrame(loop);
    }

    c.addEventListener('click', () => {
      if (gameOver) {
        score = 0; gameOver = false; fruits = [];
        document.getElementById('score').textContent = 0;
      }
    });

    loop();
  </script>
</body>
</html>
